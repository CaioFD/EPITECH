<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task02 - AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Task02</h1>

        <div id="alerta"></div>

        <form id="formulario">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" id="email" name="email" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const formulario = document.getElementById('formulario');
      const divAlerta = document.getElementById('alerta');

      function mostrarAlerta(mensagem, tipo) {
          divAlerta.innerHTML = `
              <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                  ${mensagem}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
          `;
      }

      formulario.addEventListener('submit', async (evento) => {
          evento.preventDefault();

          try {
              const resposta = await fetch('task02.php', {
                  method: 'POST',
                  body: new URLSearchParams(new FormData(formulario))
              });
              const dados = await resposta.json();

              mostrarAlerta(dados.message, resposta.ok ? 'success' : 'danger');
          } catch (erro) {
              mostrarAlerta('Ocorreu um erro: ' + erro.message, 'danger');
          }
      });
    </script>
</body>
</html>
