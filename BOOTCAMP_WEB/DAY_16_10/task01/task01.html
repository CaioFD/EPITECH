<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task01 - AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Task01</h1>

        <div id="alerta"></div>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control">
        </div>

        <button id="enviar" class="btn btn-primary">Enviar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const botao = document.getElementById('enviar');
      const campoNome = document.getElementById('nome');
      const divAlerta = document.getElementById('alerta');

      function mostrarAlerta(mensagem, tipo) {
          divAlerta.innerHTML = `
              <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                  ${mensagem}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
          `;
      }

    botao.addEventListener('click', async () => {
        const nome = campoNome.value;

        try {
            const resposta = await fetch('task01.php?name=' + encodeURIComponent(nome));

            if (!resposta.ok) {
                throw new Error('status ' + resposta.status);
            }

            const dados = await resposta.json();
            mostrarAlerta('Nome recebido: ' + dados.name, 'success');

        } catch (erro) {
            mostrarAlerta('Ocorreu um erro: ' + erro.message, 'danger');
        }
    });
    </script>
</body>
</html>
