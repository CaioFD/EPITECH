<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task07 - Mini chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Mini chat</h1>

        <div id="alerta"></div>

        <ul id="mensagens" class="list-group mb-3 overflow-auto" style="max-height: 24rem;"></ul>

        <form id="formulario" class="row g-2">
            <div class="col-md-3">
                <input type="text" id="nome" name="name" class="form-control" placeholder="Nome" required>
            </div>
            <div class="col-md-7">
                <input type="text" id="mensagem" name="message" class="form-control" placeholder="Mensagem" required>
            </div>
            <div class="col-md-2 d-grid">
                <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="task07.js"></script>
</body>
</html>
