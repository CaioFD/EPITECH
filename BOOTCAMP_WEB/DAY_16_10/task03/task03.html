<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task03 - AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container">
        <h1 class="mb-4">Task03</h1>

        <button id="carregar" class="btn btn-primary mb-3">Load countries</button>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>country-code</th>
                    <th>name</th>
                </tr>
            </thead>
            <tbody id="corpo"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const botao = document.getElementById('carregar');
      const corpo = document.getElementById('corpo');

      botao.addEventListener('click', async () => {
          corpo.innerHTML = '';

          try {
              const resposta = await fetch('countries.json');

              if (!resposta.ok) {
                  throw new Error('status ' + resposta.status);
              }

              const paises = await resposta.json();

              for (const pais of paises) {
                  const linha = corpo.insertRow();
                  linha.insertCell().textContent = pais.code;
                  linha.insertCell().textContent = pais.name;
              }
          } catch (erro) {
              corpo.innerHTML = `<tr><td colspan="2" class="text-danger">Ocorreu um erro: ${erro.message}</td></tr>`;
          }
      });
    </script>
</body>
</html>
